# Sources: inji-reference/{inji-certify,inji-verify}/docker-compose and
# conformance-suite/docker-compose-prebuilt.yml. No reference files are modified.
# All containers share DNS. Host runner uses localhost; callbacks use httpd:8443.
# httpd is the upstream nginx TLS frontend (the reference no longer uses Apache).
# Its bundled certificate is self-signed. Never use this development setup publicly.
# TODO(verify): provision trusted TLS names/certificates for Inji and import the
# suite CA into Inji trust stores; plain internal HTTP is only a bootstrap default.
services:
  postgres:
    image: postgres:${POSTGRES_TAG:-15}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEV_ONLY_CHANGE_ME}
      POSTGRES_DB: inji_verify
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # TODO(verify): supply reviewed 1.0.x schemas for BOTH databases here.
      - ${DB_INIT_DIR:-./local/db-init}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d inji_verify']
      interval: 5s
      timeout: 3s
      retries: 30

  certify:
    # Tagged upstream Helm + Docker Hub metadata verified 2026-10-23; alpha, not GA.
    # https://github.com/inji/inji-certify/blob/v1.0.0-alpha.1/helm/inji-certify/values.yaml
    image: injistack/inji-certify-with-plugins:${CERTIFY_TAG:-1.0.0-alpha.1}
    user: root
    ports: ['127.0.0.1:8090:8090']
    environment:
      active_profile_env: default,csvdp-farmer
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/inji/config/
      enable_certify_artifactory: 'false'
      download_hsm_client: 'false'
      mosip_certify_domain_url: http://certify:8090
    volumes:
      # TODO(verify): prepare release-matched properties, CSV plugin data, issuer
      # keys, credential registrations and local authorization-server settings.
      # Include alpha nonce Redis configuration; old simple-cache fixtures are insufficient.
      - ${CERTIFY_CONFIG_DIR:-./local/certify-config}:/home/inji/config:ro
      - certify-keys:/home/inji/CERTIFY_PKCS12
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Actuator path is verified in the tagged Helm startup/readiness probes.
      # TODO(verify): confirm wget availability in the alpha image at first startup.
      test: [CMD-SHELL, 'wget -q --spider http://localhost:8090/v1/certify/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  verify:
    # https://github.com/inji/inji-verify/blob/v1.0.0-alpha.1/helm/inji-verify-service/values.yaml
    # Tagged Helm and Docker Hub metadata agree; this is an alpha release.
    image: injistack/inji-verify-service:${VERIFY_TAG:-1.0.0-alpha.1}
    user: root
    ports: ['127.0.0.1:8080:8080']
    environment:
      active_profile_env: default
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-DEV_ONLY_CHANGE_ME}
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: '55000'
      INJI_VP_SUBMISSION_BASE_URL: http://verify:8080/v1/verify
      INJI_DID_VERIFY_URI: did:web:verify%3A8080:v1:verify
      INJI_DID_VERIFY_PUBLIC_KEY_URI: did:web:verify%3A8080:verify#key-0
      INJI_KEYSTORE_FILE_PASS: ${VERIFY_KEYSTORE_PASSWORD:-DEV_ONLY_CHANGE_ME}
      INJI_VERIFY_REDIRECT_URI: http://verify:8080
      INJI_VERIFY_CLAIMS_WITH_META_DATA: _sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:8080/v1/verify/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongodb:
    image: mongo:${MONGODB_TAG:-6.0.13}
    volumes: ['mongodb-data:/data/db']
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: registry.gitlab.com/openid/conformance-suite:${SUITE_TAG:-latest}
    environment:
      BASE_URL: https://httpd:8443
      BASE_MTLS_URL: https://httpd:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Temurin 21 has bash; TCP readiness precedes the frontend HTTP check.
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  httpd:
    image: registry.gitlab.com/openid/conformance-suite/nginx:${SUITE_TAG:-latest}
    ports: ['127.0.0.1:8443:8443', '127.0.0.1:8444:8444']
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # TODO(verify): confirm curl in the released suite nginx image; pin SUITE_TAG.
      test: [CMD-SHELL, 'curl --fail --silent --insecure https://localhost:8443/ >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
    driver: bridge
volumes:
  postgres-data:
  mongodb-data:
  certify-keys:
