# Sources: inji-reference/{inji-certify,inji-verify}/docker-compose and
# conformance-suite/docker-compose-prebuilt.yml. No reference files are modified.
# All containers share DNS. Host runner uses localhost; public DNS aliases resolve to httpd.
# httpd is the upstream nginx TLS frontend (the reference no longer uses Apache).
# prepare_local.py generates a local CA, SAN certificate and JVM truststore.
# TLS terminates at httpd; Java and Python validate this CA. No global TLS bypass.
services:
  postgres:
    image: postgres:${POSTGRES_TAG:-15}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEV_ONLY_CHANGE_ME}
      POSTGRES_DB: inji_verify
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tagged Certify DDL and an empty Verify schema; Verify's alpha entities build dev tables.
      - ${DB_INIT_DIR:-./local/db-init}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d inji_verify']
      interval: 5s
      timeout: 3s
      retries: 30

  certify:
    # Tagged upstream Helm + Docker Hub metadata verified 2026-10-23; alpha, not GA.
    # https://github.com/inji/inji-certify/blob/v1.0.0-alpha.1/helm/inji-certify/values.yaml
    image: injistack/inji-certify-with-plugins:${CERTIFY_TAG:-1.0.0-alpha.1}
    user: root
    environment:
      active_profile_env: default,csvdp-farmer
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/inji/config/
      enable_certify_artifactory: 'false'
      download_hsm_client: 'false'
      mosip_certify_domain_url: https://certify.test:8446
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEV_ONLY_CHANGE_ME}
      CERTIFY_KEYSTORE_PASSWORD: ${CERTIFY_KEYSTORE_PASSWORD:-DEV_ONLY_CHANGE_ME}
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.jks -Djavax.net.ssl.trustStoreType=JKS
    volumes:
      # Generated from alpha properties. Its VCICacheService supports simple cache
      # for a single pod; retain nonce/preAuthCacheTxn/credentialOfferCache names.
      - ${CERTIFY_CONFIG_DIR:-./local/certify-config}:/home/inji/config:ro
      - certify-keys:/home/inji/CERTIFY_PKCS12
      - ./local/tls/truststore.jks:/tls/truststore.jks:ro
    depends_on:
      postgres:
        condition: service_healthy
      httpd:
        condition: service_healthy
    healthcheck:
      # Check JSON body: Certify can return HTTP 200 for authentication errors.
      test: [CMD-SHELL, 'wget -qO- http://localhost:8090/v1/certify/actuator/health | grep -Eq ''"status"[[:space:]]*:[[:space:]]*"UP"''']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  verify:
    # https://github.com/inji/inji-verify/blob/v1.0.0-alpha.1/helm/inji-verify-service/values.yaml
    # Tagged Helm and Docker Hub metadata agree; this is an alpha release.
    image: injistack/inji-verify-service:${VERIFY_TAG:-1.0.0-alpha.1}
    user: root
    environment:
      active_profile_env: default
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-DEV_ONLY_CHANGE_ME}
      VERIFY_CONTEXT_PATH: /v1/verify
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/verify.properties
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: '1000'
      INJI_VP_SUBMISSION_BASE_URL: https://verify.test:8447/v1/verify
      INJI_DID_VERIFY_URI: did:web:verify.test%3A8447:v1:verify
      INJI_DID_VERIFY_PUBLIC_KEY_URI: did:web:verify.test%3A8447:v1:verify#key-0
      INJI_KEYSTORE_FILE_PASS: ${VERIFY_KEYSTORE_PASSWORD:-DEV_ONLY_CHANGE_ME}
      INJI_VERIFY_REDIRECT_URI: https://verify.test:8447
      INJI_VERIFY_CLAIMS_WITH_META_DATA: _sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.jks -Djavax.net.ssl.trustStoreType=JKS
    volumes:
      - ./local/tls/truststore.jks:/tls/truststore.jks:ro
      - ./local/tls/verify-keystore.p12:/tls/verify-keystore.p12:ro
      - ./local/verify-config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      httpd:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://localhost:8080/v1/verify/actuator/health | grep -Eq ''"status"[[:space:]]*:[[:space:]]*"UP"''']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongodb:
    image: mongo:${MONGODB_TAG:-6.0.13}
    volumes: ['mongodb-data:/data/db']
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: ${SUITE_IMAGE:-registry.gitlab.com/openid/conformance-suite@sha256:899265eabbe900a3583b2d18cca09e077a147ab1cc74dd5382c664c8a7577373}
    environment:
      BASE_URL: https://suite.test:8443
      BASE_MTLS_URL: https://suite.test:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      # Required by the suite's Spring OAuth registration even in devmode;
      # these obvious local placeholders do not authenticate to Google/GitLab.
      OIDC_GOOGLE_CLIENTID: DEV_ONLY_GOOGLE_CLIENT
      OIDC_GOOGLE_SECRET: ${SUITE_GOOGLE_SECRET:-DEV_ONLY_CHANGE_ME}
      OIDC_GITLAB_CLIENTID: DEV_ONLY_GITLAB_CLIENT
      OIDC_GITLAB_SECRET: ${SUITE_GITLAB_SECRET:-DEV_ONLY_CHANGE_ME}
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.jks -Djavax.net.ssl.trustStoreType=JKS
    volumes:
      - ./local/tls/truststore.jks:/tls/truststore.jks:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Temurin 21 has bash; TCP readiness precedes the frontend HTTP check.
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  httpd:
    image: ${SUITE_FRONTEND_IMAGE:-registry.gitlab.com/openid/conformance-suite/nginx@sha256:890aea2988fe5bb40d12561d2dd5ac5459235317bd4b5add6caf5cdb8255c783}
    ports: ['127.0.0.1:8443:8443', '127.0.0.1:8444:8444', '127.0.0.1:8446:8446', '127.0.0.1:8447:8447']
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./local/public:/fixtures:ro
      - ./local/tls/server.crt:/tls/server.crt:ro
      - ./local/tls/server.key:/tls/server.key:ro
      - ./local/tls/ca.crt:/tls/ca.crt:ro
    networks:
      default:
        aliases: [suite.test, certify.test, verify.test]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Server/frontend digests are the actual image pair exercised locally.
      test: [CMD-SHELL, 'curl --fail --silent --cacert /tls/ca.crt https://localhost:8443/ >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
    driver: bridge
volumes:
  postgres-data:
  mongodb-data:
  certify-keys:
