worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 ipv6=off valid=5s;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Variable upstreams defer DNS lookup: single-component modes need not start both apps.
    server {
        listen 8443 ssl;
        listen 8444 ssl;
        server_name suite.test localhost httpd;
        location / {
            set $suite http://server:8080;
            proxy_pass $suite;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cert $ssl_client_cert;
        }
    }
    server {
        listen 8446 ssl;
        server_name certify.test localhost;
        location /assets/ { alias /fixtures/; }
        # Alpha advertises an origin-only issuer. Its own compose nginx maps
        # root well-known URLs into the Spring /v1/certify servlet path.
        location ^~ /.well-known/ {
            set $discovery http://certify:8090;
            rewrite ^/\.well-known/(.*)$ /v1/certify/.well-known/$1 break;
            proxy_pass $discovery;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            set $issuer http://certify:8090;
            proxy_pass $issuer;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
    server {
        listen 8447 ssl;
        server_name verify.test localhost;
        location / {
            set $verifier http://verify:8080;
            proxy_pass $verifier;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
