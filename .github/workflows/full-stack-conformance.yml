name: Full stack conformance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runner/**'
      - 'configs/**'
      - 'docker-compose.yml'
      - 'run-full-stack-conformance.sh'
      - '.github/workflows/full-stack-conformance.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        component: [certify, verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # TODO(verify): provision release-matched DB/config/key fixtures and render
      # plan variables securely. Alpha Verify v2 handoff/evidence work remains.
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start stack and run conformance
        run: bash run-full-stack-conformance.sh --component '${{ matrix.component }}'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.component }}
          path: results/
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans
