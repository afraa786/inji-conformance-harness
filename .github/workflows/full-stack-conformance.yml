name: Full stack conformance
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'
  pull_request:
    paths:
      - 'runner/**'
      - 'configs/**'
      - 'testrig-bridge/**'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'run-full-stack-conformance.sh'
      - '.github/workflows/full-stack-conformance.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest runner/tests -q --junitxml=results/unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: results/unit-tests.xml
          if-no-files-found: error
  conformance:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [certify, verify, combined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare real release configuration and ephemeral development keys
        run: python runner/prepare_local.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Run real conformance plans
        id: real-run
        shell: bash
        run: |
          if [[ '${{ matrix.mode }}' == combined ]]; then
            bash run-full-stack-conformance.sh --combined
          else
            bash run-full-stack-conformance.sh --component '${{ matrix.mode }}'
          fi
      # Do not use continue-on-error: a failing plan or infrastructure error fails CI.
      - name: Save service diagnostics even after preflight/startup failure
        if: always()
        run: python runner/capture_diagnostics.py '${{ steps.real-run.outcome }}'
      - name: Summarize observed results
        if: always()
        shell: bash
        run: |
          for report in results/report-*.md; do
            [[ -f "$report" ]] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload actual results, exports and redacted service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.mode }}
          path: |
            results/
            !results/rendered/
          if-no-files-found: error
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans
